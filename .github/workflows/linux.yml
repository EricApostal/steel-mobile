name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build the app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: beta
          cache: true

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Build release app
        run: flutter build linux --release

      # tar keeps the executable bit on the launcher, which a zip would drop.
      - name: Package the app
        id: package
        run: |
          version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          name="steel-mobile-${version}-linux-x64"
          mkdir -p dist/steel-mobile
          cp -r build/linux/x64/release/bundle/. dist/steel-mobile/
          tar -czf "dist/${name}.tar.gz" -C dist steel-mobile
          rm -r dist/steel-mobile
          echo "path=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"
          ls -lh dist

      # archive: false uploads our tarball as-is instead of wrapping it in a
      # zip. (The artifact is named after the file.)
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.path }}
          archive: false
          if-no-files-found: error
