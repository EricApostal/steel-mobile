name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Analyze and build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - uses: subosito/flutter-action@v2
        with:
          channel: beta
          cache: true

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      # One APK for everything Steel runs on: arm64 phones and x86_64 emulators.
      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64,android-x64

      - name: Name the APK
        id: apk
        run: |
          version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          mkdir dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/steel-mobile-${version}-android.apk"
          echo "path=dist/steel-mobile-${version}-android.apk" >> "$GITHUB_OUTPUT"
          ls -lh dist

      # archive: false uploads the file itself, so the download is the .apk and
      # not a zip containing it. (The artifact is named after the file.)
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.path }}
          archive: false
          if-no-files-found: error
