name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Analyze and build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - uses: subosito/flutter-action@v2
        with:
          channel: beta
          cache: true

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      # Only the ABIs Steel publishes binaries for (arm64 and x86_64).
      - name: Build release APKs
        run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-x64

      - name: Collect APKs
        id: apks
        run: |
          version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          mkdir dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/steel-mobile-${version}-android-arm64.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk    "dist/steel-mobile-${version}-android-x86_64.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist/*.apk
          if-no-files-found: error
